---
name: node_context_pack_builder_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
runtime_profiles: [main]
node_version: {major: 1, minor: 0, patch: 0}
description: >
  Pure deterministic assembly of ModelContextPack from resolved context
  artifacts and a validated context profile. The node performs no I/O and
  treats cache hits as external advisory metadata, not compute truth.

handler_routing:
  routing_strategy: operation_match
  handlers:
    - operation: context_pack_builder
      handler:
        name: HandlerContextPackBuilder
        module: omnimarket.nodes.node_context_pack_builder_compute.handlers.handler_context_pack_builder

handler:
  module: omnimarket.nodes.node_context_pack_builder_compute.handlers.handler_context_pack_builder
  class: HandlerContextPackBuilder
  input_model: omnimarket.pack.model_context_pack_builder_request.ModelContextPackBuilderRequest
  output_model: omnimarket.pack.model_context_pack_builder_result.ModelContextPackBuilderResult

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000

inputs:
  contract_hash:
    type: str
    required: true
  generated_at:
    type: str
    required: true
    description: Caller-supplied timezone-aware ISO8601 UTC timestamp.
  profile:
    type: object
    required: true
  artifacts:
    type: array
    required: false
    description: >
      Whole items with caller-supplied token counts. Item-level exemplars require
      finite effectiveness_score and confidence; source_artifact_hash is their stable id.
  assembly_identity:
    type: object
    required: false
    nullable: true
    description: >
      Caller-pinned corpus_version, ruleset_hash and tokenizer_id. Required by
      item-level mode; all three are included in the full assembly digest.

assembly_policy:
  item_level_profile_field: item_level_exemplars
  item_level_default: false
  ranking: [effectiveness_score_desc, confidence_desc, source_artifact_hash_asc]
  authority_fidelity: exact_whole_item
  identity_fields: [corpus_version, ruleset_hash, tokenizer_id]

outputs:
  status:
    type: str
    enum: [ok, failed]
  context_pack:
    type: object
    required: false
    nullable: true
  pack_hash:
    type: str
    required: false
    nullable: true
  failure_class:
    type: str
    required: false
    nullable: true
  errors:
    type: array
  warnings:
    type: array
  dropped_duplicates:
    type: array
    description: Artifacts removed because their normalised content equals a kept artifact's (OMN-21125).
  excluded_by_budget:
    type: array
    description: Optional artifacts left out because they did not fit the token budget, lowest precedence first (OMN-21125).
  omitted_exemplar_count:
    type: int
    description: Whole non-fitting exemplars, excluding reported content duplicates.
  assembly_hash:
    type: str
    nullable: true
    description: Full sha256 over deterministic pack content and assembly_identity.
  fidelity:
    type: object
    nullable: true
    description: Authority fidelity violations checked against the actual packed chunks.
  failure_reason:
    type: str
    nullable: true
    enum: [FIRST_EXEMPLAR_EXCEEDS_BUDGET, AUTHORITY_FIDELITY_FAILED]

terminal_event: onex.evt.omnimarket.context-pack-build-completed.v1

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.context-pack-build-requested.v1
  publish_topics:
    - onex.evt.omnimarket.context-pack-build-completed.v1
    - onex.evt.omnimarket.context-pack-build-failed.v1

externally_consumed_topics:
  - onex.evt.omnimarket.context-pack-build-completed.v1
  - onex.evt.omnimarket.context-pack-build-failed.v1

metadata:
  transport_type: kafka

runtime_dispatch:
  # OMN-18013 -- the CLI/skill dispatcher is this node's producer. Declared so it is not inferred from subscribe_topics[0].
  command_topic: onex.cmd.omnimarket.context-pack-build-requested.v1
