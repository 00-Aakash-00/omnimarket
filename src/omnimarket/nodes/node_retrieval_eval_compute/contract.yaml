# ONEX Node Contract
# Node: NodeRetrievalEvalCompute (OMN-21132, plan task TC.9, port item AP-E1)

name: node_retrieval_eval_compute
version: "1.0.0"
contract_name: node_retrieval_eval_compute
node_name: node_retrieval_eval_compute

contract_version:
  major: 1
  minor: 0
  patch: 0

node_version:
  major: 1
  minor: 0
  patch: 0

node_type: COMPUTE_GENERIC
runtime_profiles: [main]

description: >
  Pure retrieval metric evaluation with recall over the relevance set and failed queries counted in every denominator. Deterministic percentile bootstrap intervals; no I/O during scoring.

input_model:
  name: ModelRetrievalEvalRequest
  module: omnimarket.models.retrieval_eval

output_model:
  name: ModelRetrievalEvalReport
  module: omnimarket.models.retrieval_eval

handler:
  module: omnimarket.nodes.node_retrieval_eval_compute.handlers.handler_retrieval_eval
  class: HandlerRetrievalEval
  input_model: omnimarket.models.retrieval_eval.ModelRetrievalEvalRequest

handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerRetrievalEval
        module: omnimarket.nodes.node_retrieval_eval_compute.handlers.handler_retrieval_eval
      event_model:
        name: ModelRetrievalEvalRequest
        module: omnimarket.models.retrieval_eval

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 1000

capabilities:
  - name: context.eval.retrieval-metrics
    description: Score retrieval recall, precision, AP and reciprocal rank with bootstrap intervals
    version: 1.0.0

event_bus:
  subscribe_topics:
    - onex.cmd.omnimarket.retrieval-eval-requested.v1
  publish_topics:
    - onex.evt.omnimarket.retrieval-eval-scored.v1

runtime_dispatch:
  command_topic: onex.cmd.omnimarket.retrieval-eval-requested.v1
  terminal_events:
    success: onex.evt.omnimarket.retrieval-eval-scored.v1

terminal_event: onex.evt.omnimarket.retrieval-eval-scored.v1

config:
  target_k:
    default: 10
    description: Retrieval cutoff used to judge the recall target
  min_recall_at_k:
    default: 0.8
    description: Minimum mean recall at the target cutoff
  interval_confidence:
    default: 0.95
    description: Confidence level of the percentile bootstrap interval
  bootstrap_resamples:
    default: 2000
    description: Number of bootstrap resamples of the query mean
  bootstrap_seed:
    default: 20261018
    description: Seed restarted independently for every slice and the overall row

metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-21132
  maturity: alpha
  tags:
    - context-eval
    - retrieval-metrics
