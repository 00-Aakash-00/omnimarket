name: node_context_install_confirm_trigger_effect
version: "1.0.0"
contract_name: node_context_install_confirm_trigger_effect
node_name: node_context_install_confirm_trigger_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: effect
description: >
  Read a session's captured compact content and published activations through
  ProtocolSessionCompactSource after session-content rows are applied. Delegate
  assembly to HandlerContextInstallConfirmRequest. Only request_ready carries
  the install-confirm request to publish; no_compact_records and
  all_packages_unreadable publish nothing. The projection source resolves event_id
  to session_id and reads compact chunks; handle_projected publishes an unwrapped
  request through explicit ports. Runtime assembly, the durable activation source,
  the bus publisher and replacing this reduced session-id route with the actual
  projection-applied entry remain pending (OMN-21115, TA.13). This is a draft.
input_model:
  name: ModelSessionContentAppliedEvent
  module: omnimarket.models.context_install_confirm_trigger
output_model:
  name: ModelInstallConfirmTriggerResult
  module: omnimarket.models.context_install_confirm_trigger
handler:
  module: omnimarket.nodes.node_context_install_confirm_trigger_effect.handlers.handler_context_install_confirm_trigger
  class: HandlerContextInstallConfirmTrigger
  input_model: omnimarket.models.context_install_confirm_trigger.ModelSessionContentAppliedEvent
handler_routing:
  routing_strategy: payload_type_match
  handlers:
    - handler:
        name: HandlerContextInstallConfirmTrigger
        module: omnimarket.nodes.node_context_install_confirm_trigger_effect.handlers.handler_context_install_confirm_trigger
      event_model:
        name: ModelSessionContentAppliedEvent
        module: omnimarket.models.context_install_confirm_trigger
descriptor:
  node_archetype: effect
  purity: impure
  idempotent: true
  timeout_ms: 1000
  runtime_profiles: [main]
event_bus:
  subscribe_topics:
    - onex.evt.omnimarket.projection-session-content-applied.v1
  publish_topics:
    - onex.cmd.omnimarket.context-install-confirm-requested.v1
runtime_dispatch:
  command_topic: onex.evt.omnimarket.projection-session-content-applied.v1
  terminal_events:
    success: onex.cmd.omnimarket.context-install-confirm-requested.v1
terminal_event: onex.cmd.omnimarket.context-install-confirm-requested.v1
metadata:
  author: OmniNode Team
  license: MIT
  ticket: OMN-21115
  maturity: alpha
  tags: [context-compaction, install-confirm]
