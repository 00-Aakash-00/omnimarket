title: "Context-service role task classes, routed through the routing contract (plan task TE.3)"
summary: >-
  Declare the extraction_proposer, tail_summary and context_selection task
  classes as internal classes of the task-class contract, each served by the
  local Qwen3.8-27B rung on backend local-coder with cloud routing blocked.
is_seam_ticket: false
interface_change: true
interfaces_touched: ["events"]
requirements:
  - id: "req-te3-role-task-classes"
    statement: "Each context-service model role is a task class reachable through the existing routing contract."
    acceptance:
      - id: "AC1"
        statement: "AC1: extraction_proposer, tail_summary and context_selection are internal task classes that resolve through the routing reducer to tier local, backend local-coder, model Qwen3.8-27B, and no other tier serves them -- falsifier: a class that resolves elsewhere, or a non-local tier that lists it"
      - id: "AC2"
        statement: "AC2: no lab host, port or backend is added to the public omnibase_infra -- falsifier: such a line in the diff"
evidence_requirements:
  - kind: "tests"
    description: "Role task-class declaration and routing resolution for OMN-21140."
    command: "uv run pytest tests/unit/delegation/test_context_role_task_classes_omn21140.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
