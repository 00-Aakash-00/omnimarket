schema_version: 1.0.0
ticket_id: OMN-21496
title: 'T2.6: check-only pre-commit hooks in omnimarket'
summary: No pre-commit hook of omnimarket writes a file or a commit message. The end-of-file-fixer hook is
  replaced by the pygrep hook end-of-file-check, the strip-ai-coauthor-trailer hook (perl -i on the commit
  message) is replaced by the pygrep hook refuse-ai-coauthor-trailer at the commit-msg stage, ruff-format
  runs with --check, and ruff runs with --no-fix. Each refuses and leaves the bytes alone.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
- id: req-t26-hooks-check-only
  statement: No pre-commit hook of this repository writes a file or a commit message; each refuses and leaves the bytes alone.
  acceptance:
  - id: AC1
    statement: 'AC1: No hook of omnimarket rewrites a file or a commit message: each Appendix 1 REWRITES FILES row of this repository is a check that refuses -- falsifier: pytest cases over the converted hook config and a git grep of the config for hooks whose entry writes'
  - id: AC2
    statement: 'AC2: A canary commit with an unformatted file and an AI co-author trailer is refused and the working tree is byte-identical after the hook run -- falsifier: pytest case that hashes the tree before and after the hook run, plus pre-commit run --files on the canary commit'
evidence_requirements:
- kind: tests
  description: Check-only hooks tests.
  command: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -q --no-cov --tb=line
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
- id: dod-omn21496-ac1-config
  description: AC1 reads the committed pre-commit config for writing flags and entries and for the removed hook ids, and checks the ruff hooks run check-only.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -k "gone or writing_flag or check_only or replacements" -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac1-refuse
  description: AC1 runs the replacement hooks on a canary file and a canary commit message and checks each is refused.
  source: manual
  binds_ac:
  - AC1
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -k "ruff_args or end_of_file or trailer" -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac2-ruff
  description: AC2 runs the ruff hook arguments from the committed config against an unformatted, lint-defective canary and checks the exit is non-zero and the bytes are unchanged.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -k ruff_args -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac2-trailer-eof
  description: AC2 runs the committed trailer and end-of-file hooks through pre-commit on a canary commit message and canary files, and checks each is refused with the bytes unchanged.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -k "trailer or end_of_file" -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-ac2-tree
  description: AC2 builds a scratch git repo holding an unformatted file, a file without a final newline and a commit message with an AI co-author trailer, runs the committed ruff, end-of-file and trailer hooks on it, and checks each is refused and the sha256 of every file of the tree is the same before and after.
  source: manual
  binds_ac:
  - AC2
  checks:
  - check_type: test_passes
    check_value: uv run pytest tests/ci/test_check_only_hooks_omn21496.py -k whole_tree -q --no-cov --tb=line
    cwd: ${OMNI_HOME}/omnimarket
- id: dod-omn21496-deploy-config
  description: 'Hosted deploy check: the pre-commit config at the checked-out commit declares the check-only replacements and no longer declares the two writing hooks. Needs no account, lab host or runtime.'
  source: manual
  checks:
  - check_type: command
    check_value: |
      set -eu;
      grep -q 'id: end-of-file-check' .pre-commit-config.yaml;
      grep -q 'id: refuse-ai-coauthor-trailer' .pre-commit-config.yaml;
      ! grep -qE 'id: (end-of-file-fixer|strip-ai-coauthor-trailer)' .pre-commit-config.yaml
    cwd: .
