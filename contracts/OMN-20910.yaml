---
schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "omnimarket's Hostile Reviewer workflow reads every voter from the review voters overlay (since OMN-20923 a private CI overlay fetched at run time from the repository the org variable OMNI_CI_OVERLAY_REPO names, never a file of a shipped repository) through omniintelligence's cli_review --voters-overlay, its retry-budget check and its preflight. The workflow names no voter endpoint, port, model flag or endpoint variable, and a ratchet with a known-bad positive control keeps it that way. The quorum rule and the fail-closed gate are unchanged."
is_seam_ticket: false
interface_change: true
interfaces_touched: ["events", "topics"]
requirements:
  - id: "req-workflow-reads-overlay"
    statement: "The hostile-review job resolves its voters only from the review voters overlay, at the preflight, retry-budget and review sites."
    acceptance:
      - id: "AC1"
        statement: "AC1: the preflight, retry-budget and review steps read the overlay and the overlay path is the CI overlay outside the workspace -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'reads_the_overlay or from_the_overlay or outside_the_workspace'"
  - id: "req-no-voter-endpoint-in-workflows"
    statement: "No workflow file names a review voter endpoint, port, model flag or endpoint variable."
    acceptance:
      - id: "AC3"
        statement: "AC3: a ratchet over every reviewer workflow finds no voter endpoint, port, model flag or endpoint variable, and finds all five lines of a known-bad fixture -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or llm_endpoint_variable'"
  - id: "req-no-voter-model-in-workflows"
    statement: "No reviewer workflow names a review voter model: no vars.*MODEL* reference, no model id literal, no MODEL env key bound to a literal."
    acceptance:
      - id: "AC4"
        statement: "AC4: the ratchet refuses a vars.<anything>MODEL reference, a model id literal and a MODEL env key bound to a literal, finds all five lines of a known-bad model fixture, and the new cases fail on the merge base -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
      - id: "AC5"
        statement: "AC5: the ratchet's test file runs as a step of the lint job that the required lint context covers and as a check-only pre-commit hook -- falsifier: env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
  - id: "req-register-key-declared-lane"
    statement: "onex secret register-tenant-key publishes its credential-registered event on the bound host's declared ledger_bus_lane from the lab host table when the environment names no broker, so a Claude review key registers on a lab host without KAFKA_BOOTSTRAP_SERVERS."
    acceptance:
      - id: "AC6"
        statement: "AC6: with KAFKA_BOOTSTRAP_SERVERS unset, a key bound to a host whose row names ledger_bus_lane is published on that lane through the lab-run lane resolver; a broker in the environment keeps the publisher path, and an unopenable lane is refused by name -- falsifier: uv run pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly --no-cov fails at the merge base"
  - id: "req-uncoded-signature-lifecycle"
    statement: "Build the uncoded-signature lifecycle nodes from the accepted review finding feed."
    acceptance:
      - id: "AC12"
        statement: "Pure signature computation lowercases and masks notes, stems sorted content tokens and hashes them with the family."
      - id: "AC13"
        statement: "MinHash similarity at least 0.8 groups signatures; three distinct PRs in fourteen days yield one code candidate."
      - id: "AC14"
        statement: "Replayed events emit no new candidate, including after persisted state restoration."
evidence_requirements:
  - kind: "tests"
    description: "The workflow reads the overlay at every roster site."
    command: "env -u PYTHONPATH uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-ac1-workflow-reads-overlay"
    description: "The preflight, retry-budget and review steps read the review voters overlay."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'reads_the_overlay or from_the_overlay or outside_the_workspace'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac3-no-voter-endpoint"
    description: "No reviewer workflow names a voter endpoint; the ratchet's positive control finds the known-bad lines."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -k 'ratchet or names_a_voter or llm_endpoint_variable'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn20910-ac4-no-voter-model"
    description: "The widened ratchet refuses a model variable, a model id literal and a MODEL env literal, and no reviewer workflow carries one."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn20910-ac5-ratchet-wired"
    description: "The test file is a step of the lint job (a required context) and a pre-commit hook entry."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_voters_overlay_omn20910.py -q -n 0 --no-cov -k voter_model_from_overlay_ratchet_is_wired"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC5"]
  - id: "dod-omn20910-claude-api-reviewer-pin"
    description: "The workflow pins the merged Claude API voter revision, retaining the earlier budget-timeout fix and its known-bad control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_pin_budget_timeout_omn19998.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-chunk-deadline-reviewer-pin"
    description: "The workflow pins the omniintelligence revision that scales a voter's review deadline by chunk count, retaining the earlier structured-votes pin test and its known-bad control."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_hostile_reviewer_pin_structured_votes_omn19998.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac6-register-key-declared-lane"
    description: "register-tenant-key resolves the bound host's declared bus lane when KAFKA_BOOTSTRAP_SERVERS is unset."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn20910-deploy-register-key-container-smoke"
    description: "Run the checked-out register-tenant-key CLI in a disposable container. With no environment broker, its declared host lane must be opened and receive the credential event; an environment broker and a missing or unopenable lane must retain their expected behavior. The hosted runner needs Docker and the checkout, without access to a lab broker or lane containers."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm -v "${PWD}:/workspace:ro" -w /workspace -e PYTHONDONTWRITEBYTECODE=1 -e COMPOSE_PROJECT_NAME=landing-l10892-lab -e UV_PROJECT_ENVIRONMENT=/tmp/register-key-venv -e UV_CACHE_DIR=/tmp/uv-cache ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 uv run --frozen pytest tests/unit/cli/test_omn20910_register_tenant_key_lane_bus.py -q -p no:randomly -p no:cacheprovider --no-cov --basetemp=/tmp/register-key-tests
        cwd: "${OMNI_HOME}/omnimarket"

  - id: "dod-omn20910-uncoded-signature-normalization"
    description: "Accepted X findings are lowercased, masked and stemmed into family-specific content signatures and MinHash sketches."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/test_golden_chain_review_uncoded_signature.py -q -n 0 -p no:randomly --no-cov -k 'masking or empty_content or only_typed'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC12"]
  - id: "dod-omn20910-uncoded-signature-recurrence"
    description: "Three distinct PRs within fourteen days yield one candidate; two PRs, unrelated families and expired observations do not."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/test_golden_chain_review_uncoded_signature.py -q -n 0 -p no:randomly --no-cov -k 'three_prs or two_prs or minhash or boundary or late_old or identity or unrelated'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC13"]
  - id: "dod-omn20910-uncoded-signature-replay"
    description: "Replay and state restoration retain the proposed marker; the real runtime adapters publish a candidate through the state_io outbox with an in-memory database transport."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run --frozen pytest tests/test_golden_chain_review_uncoded_signature.py -q -n 0 -p no:randomly --no-cov -k 'replayed or proposal_mark or durable_state or lab_bus_chain'"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC14"]
  - id: "dod-omn20910-deploy-signature-container"
    description: "In a disposable container, import the two nodes and exercise the canonical bus adapters and state_io candidate outbox with an in-memory database transport. No live database is required; the state table migration and accepted-record producer remain activation prerequisites."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |-
          docker run --rm -v "${PWD}:/workspace:ro" -w /workspace -e PYTHONDONTWRITEBYTECODE=1 -e UV_PROJECT_ENVIRONMENT=/tmp/review-signature-venv -e UV_CACHE_DIR=/tmp/uv-cache ghcr.io/astral-sh/uv@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58 uv run --frozen pytest tests/test_golden_chain_review_uncoded_signature.py -q -n 0 -p no:randomly -p no:cacheprovider --no-cov --basetemp=/tmp/review-signature-tests
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC12", "AC13", "AC14"]
