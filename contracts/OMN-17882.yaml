---
schema_version: "1.0.0"
ticket_id: "OMN-17882"
title: "G4 savings (omnimarket): bus-back the four savings exposures so the savings dashboard can render live rows instead of fixtures"
summary: "The tenant/day savings series view preserves its existing columns and grants while appending tenant_id, and the SavingsProjectionRunner republishes that tenant's keyed daily rows after every successful apply. This contract binds the real-Postgres view and runner-publish checks plus the existing golden-chain cache readback. The other savings exposures remain governed by their stated preconditions; dev-lane health and rendered dashboard evidence follow after deployment and the downstream consumer change."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-tenant-day-series"
    statement: "Convert the tenant/day savings-series exposure to a bus-backed keyed view without changing the prior columns, their order, grants, or tenant boundary."
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: Each savings exposure whose precondition above is discharged declares `bus_backed: true` with `key_columns`, and the savings runner publishes a keyed snapshot for it on every successful apply. An exposure whose precondition is NOT discharged stays `false` and the reason is named in the contract.
  - id: "req-runner-publishes-series"
    statement: "A successful savings apply republishes the changed tenant's keyed daily series, and a reader can serve the resulting rows from the snapshot cache."
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: Red-first golden-chain test: a delegation terminal event applied through the runner produces a snapshot delta on each flipped topic, and `SnapshotCache` serves the row back.
  - id: "req-reader-end-coverage"
    statement: "Every bus-backed exposure has a rendering consumer; the daily series is read by the omnidash Overview trend charts."
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: Reader-end coverage per OMN-17199 stays green (a bus-backed exposure with no rendering consumer must fail CI).
  - id: "req-dev-lane-serves-series"
    statement: "After deployment, the dev projection catalogue and health endpoint report the series as bus-backed."
    acceptance:
      - id: "AC4"
        statement: "AC4: GET /health on the dev lane lists the flipped topics in `bus_backed_topics`; the count moves."
  - id: "req-rendered-series"
    statement: "After deployment and the downstream omnidash consumer change, the rendered savings surface shows served daily rows rather than a pending state."
    acceptance:
      - id: "AC5"
        statement: "AC5: The RENDERED savings surface shows measured numbers rather than a pending state. A curl of a JSON route is not the proof."
  - id: "req-series-fields"
    statement: "The series retains the view fields required by the downstream savings surface."
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: The fields OMN-17340's view needs are carried: counterfactual / baseline / model routing / token usage. Previously measured 2026-09-04 (`cumulative_counterfactual_baseline_usd`, `baseline_cost_usd`, `local_pct`/`cheap_pct`/`prem_pct`, `tokens_total`/`prompt_tokens`/`completion_tokens`), so this is a re-confirmation, not new exposure work.
evidence_requirements:
  - kind: "tests"
    description: "Real-Postgres series view and runner-publish tests, plus the golden-chain tenant-scoped cache readback, pass in hosted CI."
    command: "uv run pytest tests/test_omn17426_savings_aggregate_views_per_tenant.py tests/test_omn17426_savings_aggregates_bus_backed.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn17882-ac1-series-view"
    description: "The contract declares only the eligible daily series bus-backed with the tenant/bucket key; the runner resolves that exposure, and real PostgreSQL proves the appended tenant_id column, unchanged column order and grant, distinct same-day totals for two tenants, and an absent row for an empty tenant."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17426_savings_aggregate_views_per_tenant.py::test_savings_series_keeps_same_day_totals_separate_by_tenant tests/test_omn17426_savings_aggregates_bus_backed.py::test_the_daily_series_is_backed_by_tenant_and_bucket tests/test_omn17426_savings_aggregates_bus_backed.py::test_runner_binds_both_aggregates_and_not_the_per_row_exposure -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn17882-ac2-real-runner-series-publish"
    description: "A real SavingsProjectionRunner applies one terminal event against PostgreSQL, reads the migrated series view, and emits exactly the applying tenant's expected bucket rows. The two-tenant seed makes an unscoped view read fail; the existing golden-chain check proves keyed deltas round-trip through SnapshotCache."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17426_savings_aggregate_views_per_tenant.py::test_runner_apply_publishes_only_its_tenant_series_buckets tests/test_omn17426_savings_aggregates_bus_backed.py::test_terminal_apply_publishes_and_serves_only_its_tenant_series_rows -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn17882-ac3-topic-reader-declaration"
    description: "Checks this topic's contract has a bus-backed declaration and no per-topic reader opt-out. This check does not run the cross-repository no-reader validator; omnibase_infra runs the global gate in exposure-reader-coverage.yml CI."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17426_savings_aggregates_bus_backed.py::test_the_bus_backed_series_does_not_opt_out_of_reader_coverage -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
  - id: "dod-omn17882-ac4-dev-catalogue-readback"
    description: "After deployment, a bounded read-only GET of the dev lane /health and /projections endpoints asserts the series topic is bus-backed and lists its tenant/bucket key, and that bus_backed_topics grew beyond the pre-deploy count captured from the same endpoint. Set ONEX_LAB_BASELINE_BUS_BACKED_TOPIC_COUNT from that pre-deploy readback."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "command"
        check_value: |-
          set -eu
          test -n "${ONEX_LAB_PROJECTION_API:-}"
          test -n "${ONEX_LAB_BASELINE_BUS_BACKED_TOPIC_COUNT:-}"
          api="${ONEX_LAB_PROJECTION_API%/}"
          health="$(curl --fail --silent --show-error --max-time 8 "$api/health")"
          catalog="$(curl --fail --silent --show-error --max-time 8 "$api/projections")"
          jq -n -e --argjson health "$health" --argjson catalog "$catalog" --arg topic "onex.snapshot.projection.delegation.savings-series.v1" --argjson baseline "$ONEX_LAB_BASELINE_BUS_BACKED_TOPIC_COUNT" '
            ($catalog.topics | map(select(.topic == $topic)) | first) as $row |
            if (($health.bus_backed_topics | index($topic)) != null)
              and (($health.bus_backed_topics | length) > $baseline)
              and ($row != null)
              and ($row.status == "ok")
              and ($row.backing == "bus")
              and ($row.bus_backed == true)
              and ($row.key_columns == ["tenant_id", "bucket"])
              and ($row.tenant_column == "tenant_id")
            then {topic: $topic, bus_backed_topic_count: ($health.bus_backed_topics | length), baseline_count: $baseline}
            else error("series catalogue or health readback did not meet AC4") end'
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC4"]
  - id: "dod-omn17882-ac5-rendered-series-after-consumer"
    description: "Pending the downstream omnidash consumer and deployment: the local Done gate must run the named Playwright test against the live dashboard and verify a served daily savings row is visibly rendered as a measured value, not a pending state. The check is intentionally local because hosted CI has no deployed dev dashboard."
    source: "manual"
    execution_scope: "local_done_gate"
    checks:
      - check_type: "test_passes"
        check_value: "pnpm exec playwright test tests/e2e/local-dashboard-omn17882-savings-series-live.spec.ts --grep 'AC5 rendered savings series'"
        cwd: "${OMNI_HOME}/OmniNode-Workflow/worktrees/OMN-21166/omnidash"
    binds_ac: ["AC5"]
  - id: "dod-omn17882-ac6-series-view-fields"
    description: "The real-Postgres view test asserts the exact retained column tuple and values for counterfactual, baseline, model-routing and token fields, with tenant separation and the existing grant preserved."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn17426_savings_aggregate_views_per_tenant.py::test_savings_series_keeps_same_day_totals_separate_by_tenant -q"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC6"]
  - id: "dod-omn17882-series-publish-deploy-probe"
    description: "Deploy probe. The savings runner GitHub serves at the checked-out commit republishes the tenant's daily series after each applied event; the probe reads handler_savings.py from GitHub at that commit and exits nonzero on a tree without the publish site, so it fails at the merge base."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "gh api \"repos/OmniNode-ai/omnimarket/contents/src/omnimarket/nodes/node_projection_savings/handlers/handler_savings.py?ref=$(git rev-parse HEAD)\" --jq .content | base64 -d | grep -c 'async def _publish_series_snapshot' | grep -qv '^0$'"
