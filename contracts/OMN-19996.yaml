schema_version: "1.0.0"
ticket_id: "OMN-19996"
title: "The Credentials row records when each provider key was last used in a run"
summary: >-
  The credential row gains last_used_at, the producer's envelope time of the
  latest delegation terminal (delegate-skill-completed or -failed) that named
  the key in secret_ref; the projection applies one guarded UPDATE that never
  inserts and never lowers the time; the local dispatch port stamps the key
  with the evidence row's own timestamp; migration 0010 adds the column; real
  PostgreSQL proof comes from the hosted CI service only. The omnidash column
  and the omnibase_infra vendor of 0010 are separate changes.
is_seam_ticket: false
interface_change: true
interfaces_touched: [events, protocols]
requirements:
  - id: "req-credential-last-used"
    statement: "A key's Credentials row shows when it was last used in a delegation run."
    acceptance:
      - id: "AC1"
        statement: "After a delegation on key ref X, the Credentials exposure row for X carries a last-used time equal to that run's terminal time -- falsifier: the omnimarket projection test run with uv run pytest finds a null or different value"
evidence_requirements:
  - kind: "tests"
    description: "Projection, store and local-port behaviour: one guarded UPDATE, never inserts, never lowers, both envelope seams, no write without a ref or a time."
    command: "uv run pytest tests/test_omn19996_credential_last_used.py -q -n 0 --no-cov"
  - kind: "tests"
    description: "Real PostgreSQL TIMESTAMPTZ writes through the projection runner and the sync adapter, on the hosted integration service; a service-less skip is unverified."
    command: "uv run pytest tests/test_omn19996_credential_last_used_postgres.py -q -n 0 --no-cov --junitxml=omn19996-pg.xml && uv run python scripts/ci/check_integration_skips.py --junit omn19996-pg.xml"
dod_evidence:
  - id: "dod-omn19996-last-used-unit"
    description: "Unit test pass for credential last-used logic."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19996_credential_last_used.py -q -n 0 --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
  - id: "dod-omn19996-last-used-real-postgres"
    description: "Real PostgreSQL test pass for credential last-used logic."
    source: "manual"
    binds_ac: ["AC1"]
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/test_omn19996_credential_last_used_postgres.py -q -n 0 --no-cov --junitxml=omn19996-pg.xml && uv run python scripts/ci/check_integration_skips.py --junit omn19996-pg.xml"
        cwd: "${OMNI_HOME}/omnimarket"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
