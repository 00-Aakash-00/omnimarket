---
schema_version: "1.0.0"
ticket_id: "OMN-20844"
title: "A benchmark large enough to separate the delegation rungs: a committed, tested rung driver and at least 25 mined tasks per class"
summary: "The delegation ladder's own runner (benchmarks/delegation_ladder/run_ladder.py) gains a pinned-rung mode, a sharding flag, an offline rescoring mode and a per-class, per-rung result table with 95 percent Wilson intervals (summarise_results.py). The task set grows from 28 to 135 tasks, at least 25 in each of document, review, test, reasoning and code_generation, drawn from merged changes and test suites of the public repositories and validated by execution. The free and subscription rungs are run over the whole set and the table is committed with the records and responses behind it."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-driver-committed-and-tested"
    statement: "The rung benchmark driver is part of the ladder's own runner and has a test for its per-rung, per-class result table."
    acceptance:
      - id: "AC1"
        statement: "AC1: the driver is committed and tested -- falsifier: the test and one rerun command that reproduces a cell"
  - id: "req-per-class-separation"
    statement: "The report states, per class, which rung is separated from the others and in which classes none is, from at least 25 tasks per class."
    acceptance:
      - id: "AC2"
        statement: "AC2: per-class separation stated -- falsifier: the table with intervals per class and per rung, at least 25 tasks per class"
evidence_requirements:
  - kind: "tests"
    description: "AC1: the table, separation, rung command and offline rescoring tests, and the mined-task tests that re-prove the committed bundles by execution."
    command: "uv run pytest benchmarks/delegation_ladder/tests/test_rung_table.py benchmarks/delegation_ladder/tests/test_mined_tasks.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20844-ac1-driver-tested"
    description: "AC1: the per-class, per-rung table, the separation rule, the pinned rung commands and the offline rescoring of a saved response are tested, each with a negative control. Fails at the merge base, where none of those functions exist."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest benchmarks/delegation_ladder/tests/test_rung_table.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20844-ac1-rerun-reproduces-a-cell"
    description: "AC1: the committed results rescore to the verdicts they were recorded with, from the saved responses and without a model call. This is the cell reproduction; the same driver with --rung and --only reruns a cell against the model."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run python -m benchmarks.delegation_ladder.run_ladder --rescore benchmarks/delegation_ladder/results/rungs/2026-10-14"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn20844-ac2-table-and-minimum"
    description: "AC2: every class in the committed results holds at least 25 tasks for every rung, the committed table is the table the records give, and each class states which rung (if any) is separated. Fails at the merge base, where there are 28 tasks and no per-class results."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest benchmarks/delegation_ladder/tests/test_rung_results.py benchmarks/delegation_ladder/tests/test_mined_tasks.py -q -n 0 -p no:randomly --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
