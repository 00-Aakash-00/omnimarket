---
schema_version: "1.0.0"
ticket_id: "OMN-21338"
title: "The work-ledger parity check reads each day's JSON window and the archive-roll boundary correctly, so a clean day reads exact"
summary: "The JSON row loader of the work-ledger parity check now keeps only rows inside the selected inclusive UTC window and refuses a malformed export timestamp with exit 2, as the database loader's SQL window already does. The shared work_ledger_text splitter, used by the projection parity and the branch witness, now drops a complete, self-consistent generated archive-roll header (metadata comment, banner, empty line) instead of attaching it to the preceding row, so a row keeps one identity across a roll boundary. Malformed, quoted and inconsistent lookalikes remain row content. The window and boundary fixes are already present in the dispatched dev revision. A 2026-10-25 lab read found fixture rows among the persistent extras. The emit guard now refuses a test targeting a shared broker even in spool-only mode, because a later invocation can drain those rows. Historical mismatches and backfills remain disqualifying. The new guard needs deployment; its tests do not claim a future live-day receipt."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21338-parity-window-and-boundary"
    statement: |-
      The parity check counts each row once, inside the selected UTC day, with one identity across an archive roll. The node_projection_work_ledger parity run must retain real missing, extra and state differences, including historical backfills and test contamination.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the parity check counts a row inside the selected UTC day once, whatever JSON window holds it -- falsifier: uv run pytest tests -q -k work_ledger_parity_json_window
      - id: "AC2"
        statement: |-
          AC2: a row that crosses an archive-roll boundary keeps one identity in the parity check and the branch witness -- falsifier: uv run pytest tests -q -k work_ledger_roll_boundary
      - id: "AC3"
        statement: |-
          AC3: the parity receipt for a day after the deploy has no extra or state difference caused by either defect -- falsifier: the node_projection_work_ledger parity run for that day lists an extra or state row whose cause is a window or boundary miscount
evidence_requirements:
  - kind: "tests"
    description: "Retain the already-landed JSON-window and roll-boundary controls (AC1 and AC2); the recorded fixture-spool regression fails six cases before this guard change and passes afterwards."
    command: "uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_json_window.py tests/unit/handlers/test_work_ledger_roll_boundary.py -q --no-cov"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21338-ac1-json-window"
    description: "A JSON export row is counted only inside the inclusive UTC window: both outside boundaries are dropped, both endpoints kept, an in-window extra and an in-window backfill still block an exact receipt, and a malformed timestamp exits 2 with no report or receipt. The original JSON-window patch recorded 12 failures before that fix; these controls already pass at this lane's base."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/nodes/node_projection_work_ledger/test_work_ledger_parity_json_window.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC1"]
  - id: "dod-omn21338-ac2-roll-boundary"
    description: "A generated archive-roll header never joins the row before it: repeated batches keep exact rows and hashes, continuation text around a boundary keeps its bytes, and every inconsistent or lookalike header stays visible as row content. The original roll-boundary patch recorded 3 failures before that fix; these controls already pass at this lane's base; the projection parity, branch-claim handler and resolution tests and the branch-claim and work-ledger-query golden chains still pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/handlers/test_work_ledger_roll_boundary.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC2"]
  - id: "dod-omn21338-ac3-deploy-probe"
    description: "Read-only lab proof is recorded in the PR Lab line: the projection's own database parity read for 2026-10-18 through 2026-10-24 reports only 2026-10-24 exact, with 10,614 matching rows and no backfill. Other days remain failures. A recorded database-only fixture row reproduces the spool-only escape in six failing cases before this change. These checks prevent new fixture contamination; a future post-deploy day receipt is still required, and no historical mismatch is removed or ignored. The command check runs without network on the hosted runner and fails unless the checked-out guard refuses a test's shared-broker target before spooling."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_work_ledger_emit_effect/test_work_ledger_parity_fixture_spool.py -q --no-cov"
        cwd: "${OMNI_HOME}/omnimarket"
      - check_type: "command"
        check_value: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys

          env = dict(os.environ, ONEX_TEST_CONTEXT="1", KAFKA_BOOTSTRAP_SERVERS="broker.lab.internal:9092", ONEX_EMIT_EFFECT_SPOOL_ONLY="true")
          result = subprocess.run(
              [sys.executable, "-m", "omnimarket.nodes.node_work_ledger_emit_effect.handlers.handler_work_ledger_emit_guard"],
              env=env, capture_output=True, text=True,
          )
          assert result.returncode == 79, (result.returncode, result.stdout, result.stderr)
          assert "ledger-test-write-guard" in result.stderr
          print("PASS: shared-broker test refused before spooling, including spool-only mode")
          PY
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
