schema_version: "1.0.0"
ticket_id: "OMN-19561"
title: "The delegation contracts declare no retry_policy that no handler honours"
summary: "Neither delegation contract's handler reads error_handling.retry_policy: the workflow retries come from routing_tiers.yaml and same-tier backend fallback, and the skill handler never retries a dispatch timeout. The unhonoured declaration is removed from node_delegation_orchestrator and node_delegate_skill_orchestrator. The ticket's AC2 and AC3 run in omnibase_infra (merged there as #4806 and #4290) and are listed as unbound local_done_gate items, because the hosted check carries only this repository; AC4 was merged here as #3077 and is listed as an unbound local_done_gate item, because its test already passes at this pull request's merge base and so cannot be shown to fail there."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-delegation-retry-policy-honoured-or-removed"
    statement: "Every retry_policy the delegation orchestrator contracts declare is either honoured by a handler or removed. The criteria below are transcribed from the ticket body; each id is the label a binding item claims through binds_ac. The ticket's AC2 and AC3 run in omnibase_infra and cannot run in this repository's hosted check, and its AC4 merged here as #3077 before this pull request, so all three stay in the ticket and in the unbound local_done_gate items, not in this repo-owned acceptance list."
    acceptance:
      - id: "AC1"
        statement: "AC1: every retry_policy the delegation orchestrator contract declares is either honoured by the handler or removed from the contract -- falsifier: a pytest in omnimarket that drives a provider timeout through HandlerDelegationWorkflow and asserts attempts_count against the declared max_retries"
evidence_requirements:
  - kind: "tests"
    description: "AC1: neither delegation contract declares an error_handling.retry_policy, and each keeps its error_types. The test fails against the merge base, where both contracts declared max_retries 1."
    command: "uv run pytest tests/unit/nodes/node_delegate_skill_orchestrator/test_retry_policy_contract_omn19561.py -q"
