schema_version: 1.0.0
ticket_id: OMN-21433
title: 'T-R1 and T-R2: the release classifier and the release grant read (task tickets pending)'
summary: 'Tasks T-R1 and T-R2 of the factory plan, section 7.4 and 9.9, split from omnimarket#4481: node_release_action_classify_compute
  (classify_release_action) decides admit, refuse or blocked for an action from facts, grant facts and
  the release_gate overlay policy; node_release_grant_read_effect (read_release_grant) reads a change''s
  label and push history through the change source, accepts a grant only from a person in a role list
  who applied it after the current head was pushed and not removed since, writes the authorization receipt
  at merge, and runs the release-gate check fresh at each boundary. The task tickets are minted after
  00:00Z; this contract is renamed and split per task then. The required-check workflow and ruleset wiring
  wait for the delivery bootstrap (T-V1) and T-R4.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
- public_api
requirements:
- id: req-omn21433-release-gate-r1-r2
  statement: A release is admitted only on the train's identity or a grant read from the change's history
    by a role holder; an unreadable input blocks.
  acceptance:
  - id: AC1
    statement: 'AC1: T-R1: The train''s own release is admitted unchanged, and a dev-merge tag written
      by the tagger identity is `dev_merge_tag` and admitted -- falsifier: two pytest cases with the train''s
      and the tagger''s real shapes'
  - id: AC2
    statement: 'AC2: T-R1: Each of the four release kinds from a non-train actor with no grant is refused
      naming the kind -- falsifier: four pytest cases'
  - id: AC3
    statement: 'AC3: T-R1: An action that touches a version file and matches no known shape is refused,
      not passed -- falsifier: the pytest case with an unrecognised event that edits a version file'
  - id: AC4
    statement: 'AC4: T-R1: A refused action never becomes admitted because the grant facts are missing:
      missing or unreadable grant facts are `blocked` -- falsifier: the pytest case with no grant facts'
  - id: AC5
    statement: 'AC5: T-R1: Configuration: the release shapes, the train identity and the agent identities
      are the `release_gate` overlay; the node names no login, repository or branch -- falsifier: the
      same action is refused under one overlay and admitted under an overlay that names its actor as the
      train'
  - id: AC6
    statement: 'AC6: T-R1: Bindings: depends on no protocol (it takes facts) -- falsifier: byte-identical
      results in process and through the node entry, and the conformance table lists the node with no
      protocol'
  - id: AC7
    statement: 'AC7: T-R2: A label applied by a role holder after the head''s last push is a grant, and
      the same label applied before a later push is not -- falsifier: two pytest cases, the second with
      a push event after the label event'
  - id: AC8
    statement: 'AC8: T-R2: The label applied by an agent identity, by an app or bot account, or by a login
      in neither role list is not a grant -- falsifier: three pytest cases'
  - id: AC9
    statement: 'AC9: T-R2: The grant label''s name written in the pull request body or a comment is not
      a grant -- falsifier: the pytest case'
  - id: AC10
    statement: 'AC10: T-R2: A grant whose label was later removed is not a grant -- falsifier: the pytest
      case with an unlabel event'
  - id: AC11
    statement: 'AC11: T-R2: An unreadable label history is `blocked` and the required check fails closed
      -- falsifier: a change source that raises on the label read'
  - id: AC12
    statement: 'AC12: T-R2: A grant that was green and is then revoked stops the merge and the release:
      grant, successful check, label removed, attempted merge and attempted release both refuse -- falsifier:
      the pytest case over the local host with the re-run on the unlabel event and the fresh read at each
      boundary'
  - id: AC13
    statement: 'AC13: T-R2: A pull request that edits the gate''s workflow file, its caller or the overlay
      file in its own head does not change what runs or what is read: the gate evaluates the base side
      and the private overlay -- falsifier: three pytest cases that edit each in the head and still get
      the refusal'
  - id: AC14
    statement: 'AC14: T-R2: The train is recognised by the identity the run carries, and an agent run
      named like the train, on the train''s branch name, is refused -- falsifier: the pytest case with
      a matching actor string and branch and a different run identity'
  - id: AC15
    statement: 'AC15: T-R2: A grant is bound to one head commit and one repository, and at merge the effect
      writes an authorization receipt that links the repository, the pull request, the granted head, the
      resulting merge commit, the grant event''s id and the overlay''s policy digest -- falsifier: the
      pytest case, and one receipt case each for squash, merge and rebase'
  - id: AC16
    statement: 'AC16: T-R2: Configuration: the label name, the role lists and the agent identities are
      the `release_gate` overlay (private); no login is in the node, a test or this plan -- falsifier:
      the public-name check passes and the same events give a different grant under a fixture overlay
      with different role lists'
  - id: AC17
    statement: 'AC17: T-R2: Bindings: depends on BUS, LED, CHG and CLK through the contract''s `protocol_dependencies`
      -- falsifier: the node''s tests run under the local profile (label events as ledger rows) and the
      lab profile (recorded timeline) and assert identical grant facts; a stub change source that returns
      the label''s present state without its history makes the comparison fail'
