- id: dod-omn18300-deploy-content-floor
  description: 'Hosted-runner-accessible behavioral deploy check: exercise the gate from the installed
    checkout with an explicit input field and require an omission refusal. Fails at the merge base where
    required_input_content is unsupported. This verifies shipped package behavior, not activation of a
    running service.'
  source: manual
  checks:
  - check_type: command
    check_value: 'uv run --locked python - <<''PY''

      from uuid import uuid4

      from omnimarket.nodes.node_delegation_quality_gate_reducer.handlers.handler_quality_gate import
      delta

      from omnimarket.nodes.node_delegation_quality_gate_reducer.models.model_quality_gate_input import
      ModelQualityGateInput

      source = "Diagnose this CI failure. Name the failing step and upstream run ID.\nFailing step: Validate
      metadata\nUpstream run ID: 19482736105\n"

      result = delta(ModelQualityGateInput(correlation_id=uuid4(), task_type="reasoning", llm_response_content="First,
      metadata.yaml omits a dependency. Then declare it and validate again.", dod_deterministic=("response_non_empty",
      "required_input_content"), dod_heuristic=("semantic_adequacy",)), grounding_source=source)

      assert not result.passed and result.fallback_recommended, result

      assert any("required_input_content missing" in reason and "ci_failing_step" in reason and "ci_upstream_run_id"
      in reason for reason in result.failure_reasons), result.failure_reasons

      print("installed gate refuses missing supplied CI fields")

      PY'
    cwd: .
