---
schema_version: "1.0.0"
ticket_id: "OMN-21341"
title: "TA.15c omnimarket half: the rendered mod module writes one failure line on every failure path"
summary: "The rendered Claude Code mod module's fixed failure table fell back natively (or denied) with no line at all, so a /compact whose adapter was absent, exited non-zero or threw was silent. Each failure entry now writes exactly one transcript line through $.ui.log, naming the exit code or the error text, then falls back or denies as before. This is the one failure line OMN-21116 AC2 asks for. The adapter default receipt-mode client spec moves to omnibase_infra.handlers.handler_receipt_mode_publish_await:HandlerReceiptModePublishAwait, the omnibase_infra half of OMN-21341 (AC1); AC2 (no exit 4) is proven on h200 once a dev-merge tag of omnibase_infra carrying it is installed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn21341-failure-line"
    statement: |-
      Every entry of the rendered module's failure table, at every host maximum mode, writes exactly one $.ui.log line before it falls back natively or denies, and every call into the table passes the engine interface and a reason.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the rendered mod module's fixed failure table writes exactly one transcript line through $.ui.log on every failure path (adapter absent, non-zero exit, thrown hook) before it falls back natively or denies -- falsifier: uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_render.py -q fails.
evidence_requirements:
  - kind: "tests"
    description: "AC3: the render tests, including the one-line-per-failure-entry test at every max mode and the no-branching residue check."
    command: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_render.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21341-failure-line"
    description: "AC3: one $.ui.log line per failure entry, no branching added."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_claude_code_hook_adapter_effect/test_render.py -q -n 0"
    binds_ac: ["AC3"]
  - id: "dod-omn21341-deploy-failure-line-runtime"
    description: "Hosted deploy smoke: dispatch the shipped manual compaction binding through the in-process ONEX render node at every maximum mode and read its typed receipts. Require successful receipts, a module hash matching its bytes, exactly one log call before each failure disposition, and a reason on every failure-table call. The pre-change template has no log calls. No lane services, credentials, or production install are required."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: |
          set -eu;
          export PYTHONDONTWRITEBYTECODE=1;
          export COMPOSE_PROJECT_NAME=landing-l16014-lab;
          probe_dir="$(mktemp -d)";
          trap 'rm -rf "$probe_dir"' EXIT;
          runtime_bin="$(uv run --locked python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')";
          uv run --locked python - "$probe_dir" <<'PY'
          import sys
          from pathlib import Path
          from omnimarket.models.claude_code_binding import EnumClientMaxMode, ModelBindingRenderRequest
          from omnimarket.nodes.node_claude_code_hook_adapter_effect.handlers.handler_client_bindings_loader import load_client_section
          root = Path(sys.argv[1])
          bindings = load_client_section().bindings
          assert len(bindings) == 1 and bindings[0].hook_event == "session.compact" and bindings[0].matcher_tool == "manual", bindings
          for mode in EnumClientMaxMode:
              request = ModelBindingRenderRequest(bindings=bindings, max_mode=mode)
              (root / f"{mode.value}.input.json").write_text(request.model_dump_json())
          PY
          for mode in observe selective required; do
            env ONEX_LANE=omn21341-deploy-probe "$runtime_bin/onex" node node_claude_code_binding_render_compute --input "$probe_dir/$mode.input.json" --state-root "$probe_dir/$mode.state" --backend event_bus=inmemory --timeout 30 --output receipt --omnibase-path "$PWD" > "$probe_dir/$mode.receipt.json";
          done;
          uv run --locked python - "$probe_dir" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from omnimarket.models.claude_code_binding import EnumClientMaxMode
          root = Path(sys.argv[1])
          for mode in EnumClientMaxMode:
              receipt = json.loads((root / f"{mode.value}.receipt.json").read_text())
              assert receipt["status"] == "success" and receipt["exit_code"] == 0, receipt
              rendered = receipt["result"]
              text = rendered["module_text"]
              digest = hashlib.sha256(text.encode()).hexdigest()
              assert digest == rendered["module_sha256"], receipt
              assert 'on("session.compact", { trigger: "manual" }' in text
              table = text.split("const FAILURE = {", 1)[1].split("\n}", 1)[0]
              entries = [line.strip() for line in table.splitlines() if line.strip()]
              assert [entry.split(":", 1)[0] for entry in entries] == ["never_started", "other"], entries
              deny = '{ deny: "compaction unavailable" }'
              dispositions = {"observe": ("next(e)", "next(e)"), "selective": ("next(e)", deny), "required": (deny, deny)}
              for entry, disposition in zip(entries, dispositions[mode.value], strict=True):
                  assert entry.count("$.ui.log(") == 1, entry
                  assert "($.ui.log(FAILED + why), " + disposition + ")" in entry, entry
              assert "FAILURE.other($, next, e, 'exit ' + ran.exitCode)" in text
              assert "]]($, next, e, String(err))" in text
              assert ".catch(($, e, next) => FAILURE.other($, next, e, 'hook threw'))" in text
              print(json.dumps({"mode": mode.value, "run_id": receipt["run_id"], "sha256": digest, "failure_entries": len(entries), "runtime_readback": True}))
          PY
        cwd: "${OMNI_HOME}/omnimarket"
    binds_ac: ["AC3"]
